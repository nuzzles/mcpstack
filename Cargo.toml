[package]
name = "mcpstack"
authors = ["Spencer Imbleau"]
repository = "https://github.com/nuzzles/mcpstack"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
description = "A Rust CLI for humans and agents to install multiple MCP servers, version-control and switch stacks, and share setups across teams."
readme = "README.md"

[dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt"] }
clap = { version = "4.6.7", features = ["derive", "string", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.21"
url = "2"
toml = "0.9"
toml_edit = "0.23"
similar = "2.7"
tempfile = "3"
yaml_serde = "0.10"
directories = "6"
dialoguer = { version = "0.12", default-features = false, features = ["password"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonschema = { version = "0.58.6", default-features = false }

[target.'cfg(windows)'.dependencies]
nu-ansi-term = "0.50"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Globalization"] }
