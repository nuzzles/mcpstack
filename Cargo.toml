[package]
name = "mcpstack"
authors = ["Spencer Imbleau"]
repository = "https://github.com/nuzzles/mcpstack"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT OR Apache-2.0"
description = "A Rust CLI for humans and agents to install multiple MCP servers, version-control stacks, and share setups across teams."
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "string"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2.0.21"
url = "2"
toml = "0.9"
yaml_serde = "0.10"
directories = "6"
semver = "1.0.28"

[dev-dependencies]
tempfile = "3"
