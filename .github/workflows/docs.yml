name: Documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'skills/**', 'src/**', 'Cargo.toml', 'Cargo.lock', 'README.md', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'skills/**', 'src/**', 'Cargo.toml', 'Cargo.lock', 'README.md', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and check documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned mdBook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          gh release download v0.5.4 --repo rust-lang/mdBook \
            --pattern mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz --dir "$RUNNER_TEMP/mdbook"
          echo "3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7  $RUNNER_TEMP/mdbook/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mdbook/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz" -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"
      - run: python3 docs/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/docs-site

  deploy:
    name: Publish documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
