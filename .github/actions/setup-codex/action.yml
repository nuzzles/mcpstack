name: Set up Codex
description: Install a pinned Codex CLI through npm and expose its npm or native launcher.

inputs:
  version:
    description: Exact stable Codex version, without a leading v.
    required: true
  launcher:
    description: Launcher to add to PATH (npm or native).
    default: npm
  node-version:
    description: Node version used to install and run the npm launcher.
    default: "22.22.2"

outputs:
  bin-path:
    description: Directory containing the selected Codex launcher.
    value: ${{ steps.install.outputs.bin-path }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Install Codex
      id: install
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.version }}
        CODEX_LAUNCHER: ${{ inputs.launcher }}
      run: |
        set -euo pipefail
        if [[ ! "$CODEX_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Codex version must be an exact stable version, such as 0.160.0." >&2
          exit 1
        fi
        if [[ "$CODEX_LAUNCHER" != npm && "$CODEX_LAUNCHER" != native ]]; then
          echo "Codex launcher must be npm or native." >&2
          exit 1
        fi
        export CODEX_PREFIX="$RUNNER_TEMP/mcpstack-codex/$CODEX_VERSION"
        npm install --global --prefix "$CODEX_PREFIX" --registry=https://registry.npmjs.org "@openai/codex@$CODEX_VERSION"
        node "$GITHUB_ACTION_PATH/configure.mjs"
    - name: Verify selected launcher
      shell: bash
      env:
        CODEX_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        actual=$(codex --version)
        actual=${actual%$'\r'}
        test "$actual" = "codex-cli $CODEX_VERSION"
        echo "$actual"
